*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 140px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.drop{width:28px;height:35px;flex:0 0 auto}
h1{font-family:var(--sans);font-weight:800;font-size:1.16rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{font-size:.78rem;color:var(--muted);margin-top:1px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.who button{font:inherit;color:var(--accent);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}
.adminpill{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--prog-bg);color:var(--prog);border:1px solid transparent}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px}
.tab{font-family:var(--sans);font-weight:700;font-size:.9rem;padding:9px 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:8px}
.tab:hover{border-color:var(--accent);color:var(--ink)}
.tab.on{background:var(--surface2);border-color:var(--accent);color:var(--ink)}
.tab .cnt{font-family:var(--mono);font-size:.68rem;font-weight:600;background:var(--accent);color:#04302f;border-radius:99px;padding:1px 7px}
.tab.on .cnt,.tab:hover .cnt{}
.help{font-size:.84rem;color:var(--muted);margin:8px 2px 4px;line-height:1.6}
/* buttons */
.btn{font-family:var(--sans);font-weight:700;font-size:.86rem;border-radius:999px;padding:10px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:transparent;color:#06312f}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,.card:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
/* filters + section heads */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
.chip{font-family:var(--mono);font-size:.72rem;letter-spacing:.02em;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:.15s}
.chip .ct{font-weight:600;color:var(--ink)}
.chip.on{border-color:var(--accent);color:var(--ink);background:var(--surface2)}
.chip .dotc{width:9px;height:9px;border-radius:99px}
.sec-h{font-family:var(--sans);font-weight:800;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:24px 2px 12px;display:flex;align-items:center;gap:10px}
.sec-h .ln{flex:1;height:1px;background:var(--line)}
.sec-h .n{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:.72rem}
/* figure grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.thumb{position:relative;aspect-ratio:4/3;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;top:8px;left:8px;font-family:var(--mono);font-weight:600;font-size:.72rem;background:rgba(6,20,24,.72);color:#fff;padding:3px 8px;border-radius:8px;backdrop-filter:blur(3px)}
.stripe{height:5px;width:100%;background:var(--line)}
.card.keep .stripe{background:var(--keep)} .card.needs .stripe{background:var(--needs)} .card.redo .stripe{background:var(--redo)}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.clabel{font-size:.82rem;font-weight:500;line-height:1.35;color:var(--ink)}
.usedmini{font-family:var(--mono);font-size:.62rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.usedmini b{color:var(--accent);font-weight:600}
.usedmini svg{width:11px;height:11px;opacity:.8}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.badge{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.card.keep .badge{background:var(--keep-bg);color:var(--keep);border-color:transparent}
.card.needs .badge{background:var(--needs-bg);color:var(--needs);border-color:transparent}
.card.redo .badge{background:var(--redo-bg);color:var(--redo);border-color:transparent}
.hasnote{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
/* generic panel/card for flag+comments+status */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 16px;margin:12px 0}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label.nl{font-family:var(--sans);font-weight:700;font-size:.82rem;color:var(--ink)}
label.nl .req{color:var(--redo);font-weight:700}
input[type=text],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font-family:var(--body);font-size:.94rem;padding:11px 13px;line-height:1.5}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.uprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.upbtn{font-family:var(--sans);font-weight:700;font-size:.84rem;padding:9px 14px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface2);color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.upbtn:hover{border-color:var(--accent)}
.upprev{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line);flex:0 0 auto}
.upprev img{width:100%;height:100%;object-fit:cover}
.upprev button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:99px;border:none;background:rgba(6,20,24,.78);color:#fff;font-size:.7rem;cursor:pointer;line-height:1}
/* staged list */
.staged{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:flex-start;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.srow .st-ic{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.9rem;background:var(--surface);border:1px solid var(--line)}
.srow .st-main{flex:1;min-width:0}
.srow .st-t{font-weight:600;font-size:.86rem;color:var(--ink)}
.srow .st-d{font-size:.8rem;color:var(--muted);line-height:1.45;margin-top:2px;word-break:break-word}
.srow .st-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 4px;flex:0 0 auto}
.srow .st-x:hover{color:var(--redo)}
.vpill{font-family:var(--mono);font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:99px;margin-left:6px}
.vpill.keep{background:var(--keep-bg);color:var(--keep)} .vpill.needs{background:var(--needs-bg);color:var(--needs)} .vpill.redo{background:var(--redo-bg);color:var(--redo)} .vpill.open{background:var(--prog-bg);color:var(--prog)}
/* status board */
.statgroup{margin-bottom:8px}
.stcard{background:var(--surface);border:1.5px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.stcard.pending{border-left-color:var(--pend)} .stcard.in_progress{border-left-color:var(--prog)} .stcard.done{border-left-color:var(--done)} .stcard.wont_fix{border-left-color:var(--wont)}
.stcard .sc-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--surface2);border:1px solid var(--line)}
.sc-main{flex:1;min-width:0}
.sc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sc-t{font-weight:700;font-size:.9rem;color:var(--ink)}
.sc-type{font-family:var(--mono);font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 7px}
.sc-note{font-size:.86rem;color:var(--ink);margin-top:5px;line-height:1.5;word-break:break-word}
.sc-meta{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sc-meta a{color:var(--accent);text-decoration:none}
.sc-adminnote{font-size:.82rem;color:var(--prog);background:var(--prog-bg);border-radius:8px;padding:7px 10px;margin-top:7px}
.statusbadge{font-family:var(--mono);font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:99px}
.statusbadge.pending{background:var(--pend-bg);color:var(--pend)} .statusbadge.in_progress{background:var(--prog-bg);color:var(--prog)} .statusbadge.done{background:var(--done-bg);color:var(--done)} .statusbadge.wont_fix{background:var(--wont-bg);color:var(--wont)}
.sc-admin{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.sc-admin select{width:auto;padding:6px 10px;font-size:.8rem;border-radius:9px}
.sc-admin .mini{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
/* submit bar */
.subbar{position:fixed;left:12px;right:12px;bottom:max(12px,calc(env(safe-area-inset-bottom,0px) + 12px));z-index:40;max-width:1096px;margin:0 auto;background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:12px}
.subbar.show{display:flex}
.subbar .sb-txt{font-family:var(--sans);font-weight:700;font-size:.9rem;color:var(--ink)}
.subbar .sb-txt small{display:block;font-family:var(--mono);font-weight:500;font-size:.7rem;color:var(--muted);margin-top:1px}
.subbar .sb-actions{display:flex;gap:8px;align-items:center}
/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(5,18,22,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px}
.lb.open{display:flex}
.lbpanel{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);width:min(940px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column}
.pv{position:relative;background:var(--surface2);display:flex;align-items:center;justify-content:center;min-height:240px;max-height:54vh;overflow:hidden;border-radius:20px 20px 0 0}
.pv img{max-width:100%;max-height:54vh;object-fit:contain;display:block}
.pnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:99px;border:none;background:rgba(6,20,24,.6);color:#fff;font-size:1.3rem;cursor:pointer}
.pnav:hover{background:rgba(6,20,24,.85)} .pnav.prev{left:12px} .pnav.next{right:12px}
.pclose{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:99px;border:none;background:rgba(6,20,24,.6);color:#fff;font-size:1.1rem;cursor:pointer}
.pbody{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px}
.psec{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ptitle{font-family:var(--sans);font-weight:800;font-size:1.12rem;margin:0;text-wrap:balance}
.usedwrap{display:flex;flex-wrap:wrap;gap:6px}
.usedlink{font-family:var(--mono);font-size:.64rem;font-weight:600;text-decoration:none;color:var(--accent);background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px}
.usedlink:hover{border-color:var(--accent)}
.usedlink svg{width:11px;height:11px}
.pv-used-h{font-family:var(--sans);font-weight:700;font-size:.8rem;margin:0}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rbtn{font-family:var(--sans);font-weight:700;font-size:.92rem;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.rbtn small{font-family:var(--mono);font-weight:500;font-size:.62rem;color:var(--muted)}
.rbtn:hover{border-color:currentColor}
.rbtn.keep.on{background:var(--keep-bg);border-color:var(--keep);color:var(--keep)}
.rbtn.needs.on{background:var(--needs-bg);border-color:var(--needs);color:var(--needs)}
.rbtn.redo.on{background:var(--redo-bg);border-color:var(--redo);color:var(--redo)}
/* toast + modal */
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-family:var(--sans);font-weight:700;font-size:.86rem;padding:12px 20px;border-radius:99px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,18,22,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(420px,100%);padding:22px}
.mbox h3{font-family:var(--sans);font-weight:800;margin:0 0 6px;color:var(--ink)}
.mbox p{font-size:.88rem;color:var(--muted);margin:0 0 14px;line-height:1.5}
.empty{text-align:center;color:var(--muted);font-size:.9rem;padding:34px 16px;line-height:1.6}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:99px;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:560px){ h1{font-size:1.04rem} .grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))} .rate{grid-template-columns:1fr} .top-in{gap:8px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header class="top">
 <div class="top-in">
  <div class="brand">
   <svg class="drop" viewBox="0 0 64 78" fill="none" aria-hidden="true"><defs><linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3AD8D2"/><stop offset=".5" stop-color="#12A0AE"/><stop offset="1" stop-color="#0B6472"/></linearGradient></defs><path d="M32 5C32 5 51 30 51 47A19 19 0 0 1 13 47C13 30 32 5 32 5Z" fill="url(#d)"/></svg>
   <div><h1 id="appTitle">Review Console</h1><div class="sub" id="appSub">Loading…</div></div>
  </div>
  <div class="who" id="whoBox"></div>
 </div>
</header>
<main class="wrap">
 <div class="tabs" id="tabs"></div>
 <div id="view"></div>
</main>

<div class="subbar" id="subbar">
 <div class="sb-txt" id="sbTxt">0 items ready<small>staged on this device</small></div>
 <div class="sb-actions">
  <button class="btn" id="sbClear" type="button">Clear</button>
  <button class="btn pri" id="sbSubmit" type="button">Submit to team</button>
 </div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Figure detail">
 <div class="lbpanel">
  <div class="pv">
   <span class="num" id="pvnum"></span><img id="pvimg" alt=""/>
   <button class="pnav prev" id="prev" type="button" aria-label="Previous">&#8249;</button>
   <button class="pnav next" id="next" type="button" aria-label="Next">&#8250;</button>
   <button class="pclose" id="close" type="button" aria-label="Close">&#10005;</button>
  </div>
  <div class="pbody">
   <div class="psec" id="pvsec"></div>
   <h2 class="ptitle" id="pvtitle"></h2>
   <div id="pvusedbox" style="display:none;flex-direction:column;gap:7px"><p class="pv-used-h">Where this appears in the app</p><div class="usedwrap" id="pvused"></div></div>
   <div class="rate">
    <button class="rbtn keep" data-s="keep" type="button">Keep<small>looks good</small></button>
    <button class="rbtn needs" data-s="needs" type="button">Needs work<small>close, tweak it</small></button>
    <button class="rbtn redo" data-s="redo" type="button">Redo<small>off-style / bad</small></button>
   </div>
   <label class="nl" for="note">Notes for the team</label>
   <textarea id="note" placeholder="What should change? e.g. wrong style, colors too warm, hand looks off…"></textarea>
  </div>
 </div>
</div>

<div class="modal" id="nameModal"><div class="mbox">
 <h3 id="nmH">Who's reviewing?</h3>
 <p id="nmP">Add your name so the team knows whose feedback this is. Stored on your device only.</p>
 <input type="text" id="nmInput" placeholder="e.g. Dr. Sarah Chen" autocomplete="name"/>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
  <button class="btn" id="nmCancel" type="button">Cancel</button>
  <button class="btn pri" id="nmSave" type="button">Save</button>
 </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
(function(){
 "use strict";
 var CFG = window.REVIEW_CONFIG || {};
 var APP = CFG.app || 'App';
 var SLUG = CFG.appSlug || 'app';
 var APPURL = CFG.appUrl || '';
 var FIGS = (CFG.figures||[]).map(function(f,i){return {n:f.n||i+1,url:f.url,label:f.label||('Figure '+(i+1)),section:f.section||'Figures',ref:String(f.ref||f.file||f.n||i+1),used:f.used||[]};});
 var SCREENS = CFG.screens||[];           // optional [{label,link}]
 var SB = CFG.supabase||{};
 var SB_URL=SB.url, SB_KEY=SB.anonKey, TABLE=SB.table||'review_items', BUCKET=SB.bucket||'review-uploads';
 var HASBACKEND = !!(SB_URL&&SB_KEY);
 var ADMINKEY = CFG.adminKey||'';
 var LS='review_'+SLUG;                    // local draft + identity

 // identity + admin
 var qs=new URLSearchParams(location.search);
 var IS_ADMIN = !!(ADMINKEY && qs.get('admin')===ADMINKEY);
 var store={}; try{store=JSON.parse(localStorage.getItem(LS)||'{}')||{};}catch(e){store={};}
 store.draft = store.draft || {figures:{},flags:[],comments:[]};
 function persist(){try{localStorage.setItem(LS,JSON.stringify(store));}catch(e){}}

 document.getElementById('appTitle').textContent = APP+' — Review';
 document.getElementById('appSub').textContent = IS_ADMIN ? 'Team console · you can set item status' : 'Mark what needs work, then submit to the team';
 document.title = APP+' — Review Console';

 // ---------- helpers ----------
 function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
 function uid(){return 'b'+Math.abs(Date.now()%1e9).toString(36)+Math.floor((performance.now()*1000)%1e6).toString(36);}
 var LINKICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>';
 var NOTEICON='<svg class="hasnote" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h16M4 15h9"/></svg>';
 var STATUS_LABELS={pending:'Pending',in_progress:'In progress',done:'Done',wont_fix:"Won't fix"};

 // ---------- Supabase REST ----------
 function sbHeaders(extra){var h={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};if(extra)for(var k in extra)h[k]=extra[k];return h;}
 function sbInsert(rows){return fetch(SB_URL+'/rest/v1/'+TABLE,{method:'POST',headers:sbHeaders({'Prefer':'return=representation'}),body:JSON.stringify(rows)}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||r.status);});return r.json();});}
 function sbSelect(){return fetch(SB_URL+'/rest/v1/'+TABLE+'?app_slug=eq.'+encodeURIComponent(SLUG)+'&order=created_at.desc',{headers:sbHeaders()}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
 function sbUpdate(id,patch){return fetch(SB_URL+'/rest/v1/'+TABLE+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:sbHeaders({'Prefer':'return=representation'}),body:JSON.stringify(patch)}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
 function sbUpload(file){
  var ext=(file.name.split('.').pop()||'png').toLowerCase();
  var path=SLUG+'/'+uid()+'.'+ext;
  return fetch(SB_URL+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':file.type||'image/png','x-upsert':'true'},body:file})
   .then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||r.status);});return SB_URL+'/storage/v1/object/public/'+BUCKET+'/'+path;});
 }

 // ---------- identity ----------
 function renderWho(){
  var box=document.getElementById('whoBox');
  if(IS_ADMIN){box.innerHTML='<span class="adminpill">Team view</span>';return;}
  var nm=store.submitter;
  box.innerHTML = nm ? ('Reviewing as <b>'+esc(nm)+'</b> <button id="chgName">change</button>')
                     : '<button id="chgName" style="text-decoration:none" class="btn" >Add your name</button>';
  var b=document.getElementById('chgName'); if(b)b.onclick=function(){openName();};
 }
 function openName(cb){var m=document.getElementById('nameModal');document.getElementById('nmInput').value=store.submitter||'';m.classList.add('open');setTimeout(function(){document.getElementById('nmInput').focus();},50);nameCb=cb||null;}
 var nameCb=null;
 document.getElementById('nmSave').onclick=function(){var v=document.getElementById('nmInput').value.trim();if(!v){document.getElementById('nmInput').focus();return;}store.submitter=v;persist();document.getElementById('nameModal').classList.remove('open');renderWho();var cb=nameCb;nameCb=null;if(cb)cb();};
 document.getElementById('nmCancel').onclick=function(){document.getElementById('nameModal').classList.remove('open');nameCb=null;};

 // ---------- draft counts ----------
 function draftCount(){var d=store.draft;return Object.keys(d.figures).length + d.flags.length + d.comments.length;}
 function refreshSubbar(){
  var n=draftCount(); var bar=document.getElementById('subbar');
  if(IS_ADMIN||n===0){bar.classList.remove('show');return;}
  bar.classList.add('show');
  document.getElementById('sbTxt').innerHTML=n+' item'+(n===1?'':'s')+' ready<small>staged on this device — not sent yet</small>';
 }

 // ---------- TABS ----------
 var TAB=IS_ADMIN?'status':'figures';
 function tabsDef(){
  var d=store.draft;
  var t=[];
  if(FIGS.length) t.push(['figures','Figures',Object.keys(d.figures).length]);
  t.push(['flag','Flag a screen',d.flags.length]);
  t.push(['comments','Comments',d.comments.length]);
  t.push(['status','Status board',null]);
  return t;
 }
 function renderTabs(){
  var el=document.getElementById('tabs');el.innerHTML='';
  tabsDef().forEach(function(t){
   var b=document.createElement('button');b.className='tab'+(TAB===t[0]?' on':'');b.type='button';
   b.innerHTML=esc(t[1])+(t[2]?'<span class="cnt">'+t[2]+'</span>':'');
   b.onclick=function(){TAB=t[0];render();};
   el.appendChild(b);
  });
 }
 function render(){renderTabs();renderWho();refreshSubbar();var v=document.getElementById('view');
  if(TAB==='figures')v.innerHTML=viewFigures();
  else if(TAB==='flag'){v.innerHTML=viewFlag();wireFlag();}
  else if(TAB==='comments'){v.innerHTML=viewComments();wireComments();}
  else if(TAB==='status'){v.innerHTML=viewStatus();loadStatus();}
 }

 // ---------- FIGURES ----------
 var figFilter='all';
 var FSECORDER=['Tool icon','Anatomy & site maps','Equipment','Lesson figure','Glossary figure','Complications','Figures','Other'];
 function fdraft(ref){return store.draft.figures[ref]||{status:'',note:''};}
 function usedMini(f){var u=f.used||[];if(!u.length)return '';return '<div class="usedmini">'+LINKICON+'<span>Used in <b>'+u.length+'</b> place'+(u.length>1?'s':'')+'</span></div>';}
 function viewFigures(){
  var c={all:FIGS.length,keep:0,needs:0,redo:0,none:0};
  FIGS.forEach(function(f){var s=fdraft(f.ref).status;if(s)c[s]++;else c.none++;});
  var h='<p class="help">Tap any figure, choose <b>Keep</b>, <b>Needs&nbsp;work</b>, or <b>Redo</b>, and add a note. Marked items stage below — hit <b>Submit to team</b> when you’re done.</p>';
  h+='<div class="filters">';
  [['all','All',null,c.all],['keep','Keep','var(--keep)',c.keep],['needs','Needs work','var(--needs)',c.needs],['redo','Redo','var(--redo)',c.redo],['none','Unmarked','var(--line)',c.none]].forEach(function(d){
   h+='<button class="chip'+(figFilter===d[0]?' on':'')+'" type="button" data-f="'+d[0]+'">'+(d[2]?'<span class="dotc" style="background:'+d[2]+'"></span>':'')+d[1]+' <span class="ct">'+d[3]+'</span></button>';
  });
  h+='</div>';
  var groups={};FIGS.forEach(function(f){var s=fdraft(f.ref).status;var pass=figFilter==='all'||(figFilter==='none'?!s:s===figFilter);if(!pass)return;(groups[f.section]=groups[f.section]||[]).push(f);});
  var secs=Object.keys(groups).sort(function(a,b){var ia=FSECORDER.indexOf(a),ib=FSECORDER.indexOf(b);return (ia<0?90:ia)-(ib<0?90:ib);});
  if(!secs.length){h+='<p class="empty">No figures match this filter.</p>';return h;}
  secs.forEach(function(sec){
   h+='<div class="sec-h">'+esc(sec)+'<span class="ln"></span><span class="n">'+groups[sec].length+'</span></div><div class="grid">';
   groups[sec].forEach(function(f){var st=fdraft(f.ref);
    h+='<button type="button" class="card'+(st.status?' '+st.status:'')+'" data-fig="'+f.n+'"><div class="thumb"><span class="num">#'+f.n+'</span><img loading="lazy" src="'+esc(f.url)+'" alt="'+esc(f.label)+'"/></div><div class="stripe"></div><div class="cbody"><div class="clabel">'+esc(f.label)+'</div>'+usedMini(f)+'<div class="crow"><span class="badge">'+(st.status?({keep:'Keep',needs:'Needs work',redo:'Redo'})[st.status]:'Not marked')+'</span>'+(st.note?NOTEICON:'')+'</div></div></button>';
   });
   h+='</div>';
  });
  return h;
 }
 // figure events (delegated)
 document.getElementById('view').addEventListener('click',function(e){
  var chip=e.target.closest('.chip[data-f]'); if(chip&&TAB==='figures'){figFilter=chip.dataset.f;document.getElementById('view').innerHTML=viewFigures();return;}
  var card=e.target.closest('.card[data-fig]'); if(card){openLB(+card.dataset.fig);return;}
 });

 // ---------- lightbox ----------
 var lb=document.getElementById('lb'),cur=null;
 function idxOf(n){for(var i=0;i<FIGS.length;i++)if(FIGS[i].n===n)return i;return 0;}
 function openLB(n){cur=n;var f=FIGS[idxOf(n)];
  document.getElementById('pvimg').src=f.url;document.getElementById('pvimg').alt=f.label;
  document.getElementById('pvnum').textContent='#'+f.n;
  document.getElementById('pvsec').textContent=f.section;
  document.getElementById('pvtitle').textContent=f.label;
  document.getElementById('note').value=fdraft(f.ref).note||'';
  var uw=document.getElementById('pvused'),ub=document.getElementById('pvusedbox'),used=f.used||[];
  if(used.length){uw.innerHTML=used.map(function(u){return '<a class="usedlink" href="'+esc(u.link)+'" target="_blank" rel="noopener">'+LINKICON+'<span>'+esc(u.label)+'</span></a>';}).join('');ub.style.display='flex';}
  else{uw.innerHTML='';ub.style.display='none';}
  paintRate();lb.classList.add('open');document.body.style.overflow='hidden';document.getElementById('note').blur();
 }
 function closeLB(){lb.classList.remove('open');document.body.style.overflow='';cur=null;document.getElementById('view').innerHTML=viewFigures();renderTabs();refreshSubbar();}
 function paintRate(){var s=fdraft(FIGS[idxOf(cur)].ref).status;document.querySelectorAll('.rbtn').forEach(function(b){b.classList.toggle('on',b.dataset.s===s);});}
 function setFig(s){var f=FIGS[idxOf(cur)];var o=fdraft(f.ref);if(o.status===s)s='';var note=document.getElementById('note').value;
  if(!s&&!note){delete store.draft.figures[f.ref];}else{store.draft.figures[f.ref]={status:s,note:note,n:f.n,label:f.label,section:f.section,url:f.url,link:(f.used&&f.used[0]&&f.used[0].link)||''};}
  persist();paintRate();refreshSubbar();
 }
 document.querySelectorAll('.rbtn').forEach(function(b){b.onclick=function(){setFig(b.dataset.s);};});
 var noteT;document.getElementById('note').addEventListener('input',function(){clearTimeout(noteT);var val=this.value;noteT=setTimeout(function(){var f=FIGS[idxOf(cur)];var o=fdraft(f.ref);if(!o.status&&!val){delete store.draft.figures[f.ref];}else{store.draft.figures[f.ref]={status:o.status||'',note:val,n:f.n,label:f.label,section:f.section,url:f.url,link:(f.used&&f.used[0]&&f.used[0].link)||''};}persist();refreshSubbar();},300);});
 document.getElementById('close').onclick=closeLB;
 lb.addEventListener('click',function(e){if(e.target===lb)closeLB();});
 function step(d){var i=idxOf(cur)+d;if(i<0)i=FIGS.length-1;if(i>=FIGS.length)i=0;openLB(FIGS[i].n);}
 document.getElementById('prev').onclick=function(){step(-1);};document.getElementById('next').onclick=function(){step(1);};
 document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLB();else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.target.id!=='note'){if(e.key==='1')setFig('keep');else if(e.key==='2')setFig('needs');else if(e.key==='3')setFig('redo');}});

 // ---------- FLAG A SCREEN ----------
 var flagShot=null; // {url,name} after upload
 function viewFlag(){
  var h='<p class="help">Spotted something off on a screen — wrong text, a layout glitch, anything? Flag it here instead of texting a screenshot. Add as many as you like; they stage below.</p><div class="panel">';
  // screen picker
  if(SCREENS.length){
   h+='<div class="fld"><label class="nl" for="fgScreen">Which screen / area</label><select id="fgScreen"><option value="">— pick a screen —</option>'+SCREENS.map(function(s,i){return '<option value="'+i+'">'+esc(s.label)+'</option>';}).join('')+'<option value="__other">Other / not listed</option></select></div>';
   h+='<div class="fld" id="fgOtherWrap" style="display:none"><label class="nl" for="fgOther">Describe the screen</label><input type="text" id="fgOther" placeholder="e.g. the checkout page, the profile tab"/></div>';
  } else {
   h+='<div class="fld"><label class="nl" for="fgOther">Which screen / area</label><input type="text" id="fgOther" placeholder="e.g. the home page, the IM calculator"/></div>';
  }
  h+='<div class="fld"><label class="nl" for="fgIssue">What’s wrong / what should change <span class="req">*</span></label><textarea id="fgIssue" placeholder="Describe the issue. If it’s a text fix, put the exact wording you want."></textarea></div>';
  h+='<div class="fld"><label class="nl">Screenshot (optional)</label><div class="uprow"><label class="upbtn" for="fgFile">📷 Add screenshot</label><input id="fgFile" type="file" accept="image/*" style="display:none"/><div id="fgPrev"></div><span id="fgUpMsg" class="mini" style="font-family:var(--mono);font-size:.72rem;color:var(--muted)"></span></div></div>';
  h+='<button class="btn pri" id="fgAdd" type="button">Add to submission</button></div>';
  // staged flags
  if(store.draft.flags.length){h+='<div class="sec-h">Staged screen flags<span class="ln"></span><span class="n">'+store.draft.flags.length+'</span></div>'+stagedList(store.draft.flags,'flag');}
  return h;
 }
 function wireFlag(){
  var sel=document.getElementById('fgScreen');
  if(sel)sel.onchange=function(){var w=document.getElementById('fgOtherWrap');if(w)w.style.display=(this.value==='__other')?'flex':'none';};
  var file=document.getElementById('fgFile');
  if(file)file.onchange=function(){var f=this.files&&this.files[0];if(!f)return;
   if(!HASBACKEND){toast('Uploads need the backend — describe it in text instead');return;}
   var msg=document.getElementById('fgUpMsg');msg.innerHTML='<span class="spin"></span> uploading…';
   sbUpload(f).then(function(url){flagShot={url:url,name:f.name};document.getElementById('fgPrev').innerHTML='<div class="upprev"><img src="'+esc(url)+'"/><button type="button" id="fgPrevX">✕</button></div>';document.getElementById('fgPrevX').onclick=function(){flagShot=null;document.getElementById('fgPrev').innerHTML='';};msg.textContent='';}).catch(function(){msg.textContent='upload failed — try a smaller image';});
  };
  document.getElementById('fgAdd').onclick=function(){
   var screenLabel='';
   var sel2=document.getElementById('fgScreen');var link='';
   if(sel2&&sel2.value&&sel2.value!=='__other'){var sc=SCREENS[+sel2.value];screenLabel=sc.label;link=sc.link||'';}
   else{var o=document.getElementById('fgOther');screenLabel=(o&&o.value.trim())||'General';}
   var issue=(document.getElementById('fgIssue').value||'').trim();
   if(!issue){document.getElementById('fgIssue').focus();toast('Add a short description first');return;}
   store.draft.flags.push({id:uid(),screen:screenLabel,link:link,note:issue,screenshot:flagShot?flagShot.url:''});
   flagShot=null;persist();render();toast('Added — keep going or submit');
  };
 }

 // ---------- COMMENTS ----------
 function viewComments(){
  var h='<p class="help">Anything that isn’t tied to one screen or figure — overall impressions, priorities, questions for the team.</p><div class="panel"><div class="fld"><label class="nl" for="cmText">Your comment</label><textarea id="cmText" placeholder="e.g. Overall the clinical art is strong; the biggest priority is consistent lighting across the injection icons."></textarea></div><button class="btn pri" id="cmAdd" type="button">Add comment</button></div>';
  if(store.draft.comments.length){h+='<div class="sec-h">Staged comments<span class="ln"></span><span class="n">'+store.draft.comments.length+'</span></div>'+stagedList(store.draft.comments,'comment');}
  return h;
 }
 function wireComments(){document.getElementById('cmAdd').onclick=function(){var v=(document.getElementById('cmText').value||'').trim();if(!v){document.getElementById('cmText').focus();return;}store.draft.comments.push({id:uid(),note:v});persist();render();toast('Comment added');};}

 // staged list (shared by flag + comment)
 function stagedList(arr,type){
  return '<div class="staged">'+arr.map(function(it){
   var ic=type==='flag'?'📍':'💬';
   var t=type==='flag'?esc(it.screen):'Comment';
   var extra=it.screenshot?'<div style="margin-top:6px"><img src="'+esc(it.screenshot)+'" style="max-width:120px;border-radius:8px;border:1px solid var(--line)"/></div>':'';
   return '<div class="srow"><span class="st-ic">'+ic+'</span><div class="st-main"><div class="st-t">'+t+'</div><div class="st-d">'+esc(it.note)+'</div>'+extra+'</div><button class="st-x" type="button" data-del="'+it.id+'" data-type="'+type+'" aria-label="Remove">✕</button></div>';
  }).join('')+'</div>';
 }
 document.getElementById('view').addEventListener('click',function(e){
  var x=e.target.closest('.st-x[data-del]'); if(!x)return;
  var id=x.dataset.del,tp=x.dataset.type;
  if(tp==='flag')store.draft.flags=store.draft.flags.filter(function(i){return i.id!==id;});
  else store.draft.comments=store.draft.comments.filter(function(i){return i.id!==id;});
  persist();render();
 });

 // ---------- SUBMIT ----------
 function buildRows(batch){
  var rows=[],d=store.draft,who=store.submitter||'Anonymous';
  Object.keys(d.figures).forEach(function(ref){var f=d.figures[ref];rows.push({app_slug:SLUG,batch_id:batch,submitter:who,item_type:'figure',item_ref:ref,item_label:f.label,item_link:f.link||'',verdict:f.status||'open',note:f.note||'',screenshot_url:f.url||'',review_status:'pending'});});
  d.flags.forEach(function(fl){rows.push({app_slug:SLUG,batch_id:batch,submitter:who,item_type:'screen',item_ref:'',item_label:fl.screen,item_link:fl.link||'',verdict:'open',note:fl.note,screenshot_url:fl.screenshot||'',review_status:'pending'});});
  d.comments.forEach(function(cm){rows.push({app_slug:SLUG,batch_id:batch,submitter:who,item_type:'general',item_ref:'',item_label:'General comment',item_link:'',verdict:'open',note:cm.note,screenshot_url:'',review_status:'pending'});});
  return rows;
 }
 document.getElementById('sbClear').onclick=function(){if(!confirm('Clear all staged items on this device? This does not affect anything already submitted.'))return;store.draft={figures:{},flags:[],comments:[]};persist();render();};
 document.getElementById('sbSubmit').onclick=function(){
  if(draftCount()===0)return;
  if(!store.submitter){openName(function(){doSubmit();});return;}
  doSubmit();
 };
 function doSubmit(){
  if(!HASBACKEND){ // no backend: fall back to a downloadable file
   var rows=buildRows(uid());
   var blob=new Blob([JSON.stringify({app:APP,submitter:store.submitter,generated:new Date().toISOString(),items:rows},null,2)],{type:'application/json'});
   var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='review-'+SLUG+'.json';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(url);},400);
   toast('No live backend — feedback downloaded to send back');return;
  }
  var btn=document.getElementById('sbSubmit');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Sending…';
  var batch=uid();var rows=buildRows(batch);
  sbInsert(rows).then(function(){
   store.draft={figures:{},flags:[],comments:[]};persist();
   btn.disabled=false;btn.textContent='Submit to team';
   toast(rows.length+' item'+(rows.length===1?'':'s')+' sent to the team ✓');
   TAB='status';render();
  }).catch(function(err){
   btn.disabled=false;btn.textContent='Submit to team';
   toast('Could not send — check connection and retry');
  });
 }

 // ---------- STATUS BOARD ----------
 var statusData=null, statusFilter='all';
 function viewStatus(){
  var h='<p class="help">'+(IS_ADMIN?'Every item the client has submitted. Set a status and it updates for them live.':'Live status of everything submitted. The team updates these as they work through them.')+'</p>';
  h+='<div class="filters" id="stFilters"></div><div id="stBoard"><p class="empty"><span class="spin"></span> Loading submitted items…</p></div>';
  return h;
 }
 function loadStatus(){
  if(!HASBACKEND){document.getElementById('stBoard').innerHTML='<p class="empty">No live backend configured, so there’s no shared status board. Feedback is exported as a file instead.</p>';document.getElementById('stFilters').style.display='none';return;}
  sbSelect().then(function(rows){statusData=rows;paintStatus();}).catch(function(){document.getElementById('stBoard').innerHTML='<p class="empty">Could not load the board. Refresh to try again.</p>';});
 }
 function paintStatus(){
  var rows=statusData||[];
  var counts={all:rows.length,pending:0,in_progress:0,done:0,wont_fix:0};
  rows.forEach(function(r){counts[r.review_status]=(counts[r.review_status]||0)+1;});
  var ff=document.getElementById('stFilters');
  ff.innerHTML=[['all','All',null],['pending','Pending','var(--pend)'],['in_progress','In progress','var(--prog)'],['done','Done','var(--done)'],['wont_fix',"Won't fix",'var(--wont)']].map(function(d){
   return '<button class="chip'+(statusFilter===d[0]?' on':'')+'" type="button" data-sf="'+d[0]+'">'+(d[2]?'<span class="dotc" style="background:'+d[2]+'"></span>':'')+d[1]+' <span class="ct">'+(counts[d[0]]||0)+'</span></button>';
  }).join('');
  ff.querySelectorAll('.chip[data-sf]').forEach(function(b){b.onclick=function(){statusFilter=b.dataset.sf;paintStatus();};});
  var board=document.getElementById('stBoard');
  var list=rows.filter(function(r){return statusFilter==='all'||r.review_status===statusFilter;});
  if(!list.length){board.innerHTML='<p class="empty">'+(rows.length?'Nothing in this status.':'No items submitted yet. Marked figures, screen flags, and comments show up here once the client hits Submit.')+'</p>';return;}
  // order: pending, in_progress, done, wont_fix
  var ord={pending:0,in_progress:1,done:2,wont_fix:3};
  list.sort(function(a,b){return (ord[a.review_status]-ord[b.review_status])||(a.created_at<b.created_at?1:-1);});
  board.innerHTML=list.map(stCard).join('');
  if(IS_ADMIN)board.querySelectorAll('.sc-status-sel').forEach(function(sel){sel.onchange=function(){setStatus(sel.dataset.id,sel.value,sel);};});
 }
 function stCard(r){
  var typeIc=r.item_type==='figure'?'🖼':r.item_type==='screen'?'📍':'💬';
  var vp=r.verdict&&r.verdict!=='open'?'<span class="vpill '+r.verdict+'">'+({keep:'Keep',needs:'Needs work',redo:'Redo'})[r.verdict]+'</span>':'';
  var thumb=r.screenshot_url?'<img class="sc-thumb" src="'+esc(r.screenshot_url)+'" alt=""/>':'';
  var link=r.item_link?'<a href="'+esc(r.item_link)+'" target="_blank" rel="noopener">open in app ↗</a>':'';
  var when=(''+r.created_at).slice(0,10);
  var admin='';
  if(IS_ADMIN){
   admin='<div class="sc-admin"><select class="sc-status-sel" data-id="'+r.id+'">'+
     ['pending','in_progress','done','wont_fix'].map(function(s){return '<option value="'+s+'"'+(r.review_status===s?' selected':'')+'>'+STATUS_LABELS[s]+'</option>';}).join('')+
     '</select><span class="mini" data-saved="'+r.id+'"></span></div>';
  }
  var adminNote=r.admin_note?'<div class="sc-adminnote">Team: '+esc(r.admin_note)+'</div>':'';
  return '<div class="stcard '+r.review_status+'">'+thumb+'<div class="sc-main"><div class="sc-top"><span class="sc-type">'+typeIc+' '+esc(r.item_type)+'</span><span class="sc-t">'+esc(r.item_label||'Item')+(r.item_ref?(' #'+esc(r.item_ref)):'')+'</span>'+vp+'<span class="statusbadge '+r.review_status+'">'+STATUS_LABELS[r.review_status]+'</span></div>'+(r.note?'<div class="sc-note">'+esc(r.note)+'</div>':'')+adminNote+'<div class="sc-meta"><span>'+esc(r.submitter||'Anonymous')+'</span><span>'+when+'</span>'+link+'</div>'+admin+'</div></div>';
 }
 function setStatus(id,val,sel){
  var msg=document.querySelector('[data-saved="'+id+'"]');if(msg)msg.innerHTML='<span class="spin"></span>';
  sbUpdate(id,{review_status:val}).then(function(){
   if(statusData){for(var i=0;i<statusData.length;i++)if(statusData[i].id===id)statusData[i].review_status=val;}
   if(msg){msg.textContent='saved ✓';setTimeout(function(){msg.textContent='';},1400);}
   paintStatus();
  }).catch(function(){if(msg)msg.textContent='failed';});
 }

 // ---------- toast ----------
 var toastT;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2400);}

 render();
})();
</script>
