<text x="700" y="790" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#243239" text-anchor="middle">Positive. The induration measures 15 mm, over the 5 mm cutoff.</text>
<text x="700" y="836" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="400" fill="#243239" text-anchor="middle">Measure the firm raised area across the forearm. Redness alone is recorded as 0 mm.</text>
