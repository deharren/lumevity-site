<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" role="img" aria-label="Atlas plate: a positive tuberculin skin test. A firm raised induration is measured across the forearm with a millimetre ruler whose zero mark sits on its left border and whose fifteen millimetre mark sits on its right border. The flat redness around it is not measured.">
<title>Positive tuberculin skin test, induration 15 mm</title>
<defs>
  <linearGradient id="gSkin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F3CBA4"/><stop offset="0.55" stop-color="#EDBE91"/><stop offset="1" stop-color="#E3AC7B"/>
  </linearGradient>
  <radialGradient id="gEry" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0.30" stop-color="#DE7573" stop-opacity="0.85"/>
    <stop offset="0.66" stop-color="#E07E7C" stop-opacity="0.62"/>
    <stop offset="0.88" stop-color="#E89490" stop-opacity="0.3"/>
    <stop offset="1" stop-color="#E89490" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gDome" cx="0.38" cy="0.3" r="0.82">
    <stop offset="0" stop-color="#EFC2BB"/><stop offset="0.62" stop-color="#E7AFA9"/>
    <stop offset="0.9" stop-color="#D98D8C"/><stop offset="1" stop-color="#C87376"/>
  </radialGradient>
  <linearGradient id="gRule" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FDFEFE" stop-opacity="0.94"/>
    <stop offset="0.5" stop-color="#F7FAFB" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#E6ECF0" stop-opacity="0.92"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="clipPanel"><rect x="120" y="150" width="1160" height="556" rx="20"/></clipPath>
</defs>

<rect width="1400" height="920" fill="#FFFFFF"/>
<rect x="120" y="150" width="1160" height="556" rx="20" fill="url(#gSkin)"/>
<g clip-path="url(#clipPanel)">
  <ellipse cx="520" cy="330" rx="310" ry="228" fill="url(#gEry)"/>
  <ellipse cx="534" cy="360" rx="152" ry="104" fill="#8E5250" opacity="0.4" filter="url(#soft)"/>
  <ellipse cx="520" cy="330" rx="150" ry="105" fill="url(#gDome)"/>
  <path d="M370,330 a150,105 0 0 0 300,0 a150,105 0 0 0 -300,0 Z" fill="#B96A6C" opacity="0.28" filter="url(#soft2)"/>
  <ellipse cx="520" cy="330" rx="150" ry="105" fill="none" stroke="#C0666A" stroke-width="3" opacity="0.9"/>
  <ellipse cx="520" cy="330" rx="139" ry="95" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.16"/>
  <ellipse cx="500" cy="300" rx="104" ry="56" fill="#FFFFFF" opacity="0.14" filter="url(#soft)"/>
</g>
